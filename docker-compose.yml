services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

  frontend-dev:
    build: 
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000

  eu-west-1:
    build: ./server
    environment:
      SERVER_NAME: eu-west-1
      ZONE: eu-west

  eu-west-2:
    build: ./server
    environment:
      SERVER_NAME: eu-west-2
      ZONE: eu-west

  eu-west-3:
